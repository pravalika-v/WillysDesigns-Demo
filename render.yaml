services:
  - type: web
    name: willysdesigns-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PROVIDER
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
